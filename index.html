<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Martin Pietruska">
    <title>Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"> <!-- Pobiera Noto Sans z oficjalnej strony googla -->
    <link rel="stylesheet" href="style.css"> <!--Link do arkusza kaskadowego-->
</head>

<body>
    <div id="start-container" class="view-containers"> <!-- Kontener całej strony pierwszej -->
        <header id="start-header-container"> <!-- Kontener tytułu -->
            <h1 id="start-header-title"> Quiz Programistyczny </h1> <!-- Tytuł -->
        </header>

        <main id="start-main-container"> <!-- Kontener przycisku start -->
            <button id="start-button" >Start</button> <!-- Przycisk start -->
        </main>
    </div>

    <div id="quiz-container" class="view-containers" hidden> <!-- Kontener całego quizu -->
        <header id="quiz-header-container">  <!-- Kontener pytania -->
            <h1 id="quiz-header-title"></h1> <!-- Tekst pytania -->
        </header>

        <main id="quiz-main-container"> <!-- Kontener odpowiedzi -->
            <div id="quiz-answers-container"></div>
            <img id="quiz-question-image" alt="" hidden>
        </main>

    </div>

    <div id="end-container" class="view-containers" hidden> <!-- Kontener całego podsumowanie -->
        <header id="end-header-container"> <!-- Kontener tytuły -->
            <h1 id="end-header-title"> Podsumowanie quizu programistycznego: </h1>
            <p id="end-header-score"></p>
        </header>

        <main id="end-main-container"> <!-- Kontener podsumowania -->
            <ul id="end-main-question-list"> <!-- Lista podsumowania -->
            </ul>
            <div id="end-total-time-container" aria-label="Łączny czas odpowiedzi">
                <span>Łączny czas:</span>
                <output id="end-total-time">000</output>
                <span>s</span>
            </div>
        </main>

        <aside id="end-aside-container">
            <button id="end-button" class="btn" type="button">Wróć do startu</button>
        </aside>
    </div>
<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
